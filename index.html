<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GN8 내 차도 되나?</title>
  <meta name="description" content="Hyundai UserStory 인터랙티브 플레이북">
  <meta property="og:type" content="website">
  <meta property="og:title" content="GN8 내 차도 되나? - Hyundai UserStory">
  <meta property="og:description" content="Hyundai UserStory 인터랙티브 플레이북">
  <meta property="og:url" content="https://userstorygn803.vercel.app/">
  <link rel="stylesheet" href="style.css?v=20260806-tech-r3">
</head>
<body>
  <main class="sequence-root">
    <video id="sequence-video" playsinline preload="auto"></video>
  </main>

  <header id="scenario-header" class="top-center-header">
    <h1 class="header-title">GN8 내 차도 되나?</h1>
  </header>

  <button id="back-button" class="back-nav-btn" type="button" aria-label="플레이북 처음으로 돌아가기" hidden>
    <img src="Asset/Playbook/_Button/BT_Back.svg" alt="뒤로가기" draggable="false">
  </button>

  <section id="scenario-canvas-stage" class="scenario-canvas-stage" aria-label="시나리오 캔버스">
    <div class="canvas-viewport">
      <div id="scenario-canvas-track" class="canvas-track">
        <div class="canvas-slide active"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_01.jpg" alt="시나리오 캔버스 1" draggable="false"></div>
        <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_02.jpg" alt="시나리오 캔버스 2" draggable="false"></div>
        <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_03.jpg" alt="시나리오 캔버스 3" draggable="false"></div>
        <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_04.jpg" alt="시나리오 캔버스 4" draggable="false"></div>
        <div class="canvas-slide"><img src="Asset/ScenarioCanvas/3_ScenarioCanvas_05.jpg" alt="시나리오 캔버스 5" draggable="false"></div>
      </div>
    </div>
    <div class="canvas-bottom-controls">
      <div id="scenario-indicator" class="canvas-pagination" aria-label="시나리오 캔버스 페이지">
        <div class="pagination-dots">
          <button class="p-dot active" type="button" data-idx="0" aria-label="1페이지"></button>
          <button class="p-dot" type="button" data-idx="1" aria-label="2페이지"></button>
          <button class="p-dot" type="button" data-idx="2" aria-label="3페이지"></button>
          <button class="p-dot" type="button" data-idx="3" aria-label="4페이지"></button>
          <button class="p-dot" type="button" data-idx="4" aria-label="5페이지"></button>
        </div>
        <span id="indicator-counter" class="pagination-text">01 / 05</span>
      </div>
    </div>
  </section>

  <button id="start-overlay" class="start-overlay" type="button" aria-label="클릭하여 시작">
    <span class="start-guide-content">
      <span class="start-guide-motion" aria-hidden="true"></span>
      <span class="start-guide-copy">
        <strong>클릭하여 시작</strong>
        <small>사운드와 함께 재생됩니다</small>
      </span>
    </span>
  </button>
  <button id="skip-button" class="media-skip-button" type="button" hidden>SKIP</button>
  <button id="playback-button" class="media-playback-button" type="button" aria-label="재생" hidden>▶</button>
  <div id="volume-control" class="media-volume-control" hidden>
    <input id="volume-slider" class="media-volume-slider" type="range" min="0" max="1" step=".05" aria-label="볼륨">
    <button id="volume-button" class="media-volume-button" type="button" aria-label="음소거">🔊</button>
  </div>

  <script type="module" src="app.js?v=20260806-tech-r3"></script>
</body>
</html>
