<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyundai UserStory 20px-Tech</title>
  <meta name="description" content="Hyundai UserStory 인터랙티브 플레이북 (Tech 버전)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Hyundai UserStory 20px-Tech">
  <meta property="og:description" content="Hyundai UserStory 인터랙티브 플레이북 (Tech 버전)">
  <link rel="stylesheet" href="style.css?v=20260806-tech-r1">
</head>
<body data-phase="playbook" data-indicator-tone="white">

  <header class="top-center-header">
    <h1 class="header-title">Hyundai UserStory</h1>
  </header>

  <!-- ── Playbook 메인 시퀀스 ── -->
  <main class="playbook-sequence" aria-label="플레이북 시퀀스">
    <section class="playbook-preview">
      <article class="preview-panel">
        <span>PLAYBOOK</span>
        <strong>LEFT CONTENT</strong>
      </article>
      <article class="preview-panel">
        <span>PLAYBOOK</span>
        <strong>RIGHT CONTENT</strong>
      </article>
    </section>
  </main>

  <!-- ── 시나리오 캔버스 ── -->
  <section id="scenario-canvas-stage" class="scenario-canvas-stage" aria-label="시나리오 캔버스">
    <div class="canvas-viewport">
      <div id="scenario-canvas-track" class="canvas-track">
        <article class="canvas-slide active" data-canvas-index="0">
          <div class="canvas-frame">SCENARIO CANVAS 01</div>
        </article>
        <article class="canvas-slide" data-canvas-index="1">
          <div class="canvas-frame">SCENARIO CANVAS 02</div>
        </article>
        <article class="canvas-slide" data-canvas-index="2">
          <div class="canvas-frame">SCENARIO CANVAS 03</div>
        </article>
        <article class="canvas-slide" data-canvas-index="3">
          <div class="canvas-frame">SCENARIO CANVAS 04</div>
        </article>
      </div>
    </div>

    <div class="canvas-bottom-controls">
      <div id="scenario-indicator" class="canvas-pagination" aria-label="시나리오 캔버스 페이지">
        <div class="pagination-dots">
          <button class="p-dot active" type="button" data-idx="0" aria-label="1페이지"></button>
          <button class="p-dot" type="button" data-idx="1" aria-label="2페이지"></button>
          <button class="p-dot" type="button" data-idx="2" aria-label="3페이지"></button>
          <button class="p-dot" type="button" data-idx="3" aria-label="4페이지"></button>
        </div>
        <span id="indicator-counter" class="pagination-text">01 / 04</span>
      </div>
    </div>
  </section>

  <p class="flow-guide">스크롤하여 시퀀스를 전환하세요</p>

  <script type="module" src="app.js?v=20260806-tech-r1"></script>
</body>
</html>
